[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
version = "0.1.0"
description = "Production multimodal RAG system with hybrid retrieval and CI-gated evaluation"
requires-python = ">=3.11"
dependencies = [
    # LLM + Vision
    "anthropic>=0.40.0",
    # Embeddings
    "openai>=1.50.0",
    # Vector DB
    "qdrant-client>=1.12.0",
    # Sparse retrieval
    "rank-bm25>=0.2.2",
    # Reranking
    "cohere>=5.11.0",
    # PDF parsing
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    # DOCX
    "python-docx>=1.1.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # UI
    "streamlit>=1.40.0",
    # Evaluation
    "ragas==0.4.3",
    "datasets>=3.1.0",
    # Config
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    # Utilities
    "tiktoken>=0.8.0",
    "Pillow>=11.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "numpy>=2.1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "langchain-community==0.3.31",  # pinned: 0.4.x drops langchain_community.chat_models.vertexai, which ragas 0.4.3 hard-imports
    "langchain-qdrant>=0.2.0",
    "langchain-cohere>=0.3.0",
    "fastembed>=0.4.0",
    "langchain-ollama>=1.0.0",
    "langchain-huggingface>=1.2.0",
    "langchain>= v0.6.0",
    "langchain-classic>=1.0.8",  # MultiQueryRetriever, ContextualCompressionRetriever, CrossEncoderReranker
    "redis>=5.0.0",  # session-scoped conversation memory backing store

]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
